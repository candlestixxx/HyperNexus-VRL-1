# Bare Nginx reverse proxy — the "absolute floor" baseline (no auth at all).
# A fairer Redis-class comparison is Kong with key-auth (deploy/kong/kong.yml).
# Run: nginx -c $PWD/deploy/nginx/nginx.conf -p $PWD
events { worker_connections 1024; }

http {
    server {
        listen 8000;
        location /dispatch/ {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
        }
    }
}
