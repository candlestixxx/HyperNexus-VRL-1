# Kong declarative baseline (the Redis-class API gateway comparison).
# Run on Linux/WSL:  docker run -d -p 8000:8000 -v $PWD:/etc/kong kong
# Then drive it with benchmarks/bench_crucible.py pointed at http://127.0.0.1:8000
# (or the Linux run script benchmarks/run_crucible_linux.sh).
_format_version: "3.0"

services:
  - name: upstream
    url: http://host.docker.internal:9000   # mock upstream
    routes:
      - name: dispatch
        paths:
          - /dispatch
        strip_path: false
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey

consumers:
  - username: tenant_a
    keyauth_credentials:
      - key: bench-tenant-key
